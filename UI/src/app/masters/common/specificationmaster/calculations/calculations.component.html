<h3 class="text-center">
  {{ data.rowData.Checkpoint_Name + " - " + data.rowData.Location_Name }}
</h3>
<div class="row m-0">
  <div class="col-md-6">
    <mat-form-field appearance="fill" style="width: 100%; height: 70px">
      <mat-label>From Date</mat-label>
      <input
        style="border: none !important"
        #startdatepicker1
        matInput
        [matDatepicker]="picker1"
        (dateChange)="onStartDateChange($event)"
      />
      <mat-datepicker-toggle
        matIconSuffix
        [for]="picker1"
      ></mat-datepicker-toggle>
      <mat-datepicker #picker1></mat-datepicker>
    </mat-form-field>
  </div>
  <div class="col-md-6">
    <mat-form-field appearance="fill" style="width: 100%; height: 70px">
      <mat-label>To Date</mat-label>
      <input
        style="border: none !important"
        #enddatepicker1
        matInput
        [matDatepicker]="picker"
        (dateChange)="onEndDateChange($event)"
      />
      <mat-datepicker-toggle
        matIconSuffix
        [for]="picker"
      ></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>
  </div>
</div>
<div class="row m-0">
  <table class="table table-hover" style="margin: 0px">
    <thead>
      <tr>
        <th class="th">#</th>
        <th class="th">Current Control Limits</th>
        <th class="th">Calculated Control Limit</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>LCL</td>
        <td class="td">{{ data.rowData.LCL }}</td>
        <td class="td">{{ calculatedLCL }}</td>
      </tr>
      <tr>
        <td>UCL</td>
        <td class="td">{{ data.rowData.UCL }}</td>
        <td class="td">{{ calculatedUCL }}</td>
      </tr>
      <tr>
        <td>UCL R</td>
        <td class="td">{{ data.rowData.UCLR }}</td>
        <td class="td">{{ calculatedUCLR }}</td>
      </tr>
    </tbody>
  </table>
</div>

<mat-dialog-actions class="text-center">
  <div class="row" style="width: 100%; margin: 0px">
    <div class="col-md-12">
      <div class="delete-confirmation-actions">
        <button mat-raised-button color="warn" (click)="onCancel()">
          Cancel
        </button>
        <button
          *ngIf="calculatedLCL && calculatedUCL"
          mat-raised-button
          color="primary"
          (click)="onSave()"
        >
          Update
        </button>
      </div>
    </div>
  </div>
</mat-dialog-actions>
