<!-- Mid section row START -->
<div class="row">
  <div
    class="master-headings q-strip"
    style="width: 100%; font-weight: 900; margin-top: 36px"
    id="btn-add"
  >
    Shop Master
  </div>
  <div *ngIf="canCreate || modify" class="col-md-12 defect-min-box">
    <form [formGroup]="shopForm" (ngSubmit)="onSave()">
      <div class="panel q-sm-btm-margin">
        <div class="panel-body q-panel-body">
          <div class="col-md-10 defect-min-box">
            <div class="row">
              <div class="col-md-4">
                <div
                  class="form-group form-animate-text"
                  style="margin-top: 10px !important"
                >
                  <input
                    type="text"
                    class="form-text"
                    title="Please enter shop name"
                    required
                    formControlName="textboxShopName"
                    [(ngModel)]="selectedShopName"
                  />
                  <span class="bar"></span>
                  <label>Shop Name *</label>
                  <div
                    *ngIf="
                      shopForm.get('textboxShopName').errors &&
                      (shopForm.get('textboxShopName').dirty ||
                        shopForm.get('textboxShopName').touched)
                    "
                    class="form-errors-wrapper"
                  >
                    <div
                      *ngIf="
                        shopForm.get('textboxShopName').hasError('required')
                      "
                    >
                      Shop name field is required.
                    </div>
                    <div
                      *ngIf="
                        shopForm.get('textboxShopName').hasError('minlength')
                      "
                    >
                      MinLength 3 characters required.
                    </div>
                    <div
                      *ngIf="
                        shopForm.get('textboxShopName').hasError('maxlength')
                      "
                    >
                      MaxLength is 80 characters.
                    </div>
                    <div
                      *ngIf="
                        shopForm.get('textboxShopName').hasError('pattern')
                      "
                    >
                      please enter valid shop name.
                    </div>
                    <span class="bar"></span>
                  </div>
                </div>
              </div>
              <div class="col-md-4">
                <div
                  class="form-group form-animate-text"
                  style="margin-top: 10px !important"
                >
                  <input
                    type="text"
                    class="form-text"
                    title="Please enter shop name"
                    required
                    formControlName="textboxShopDescription"
                    [(ngModel)]="selectedShopDescription"
                  />
                  <span class="bar"></span>
                  <label>Shop Description *</label>
                  <div
                    *ngIf="
                      shopForm.get('textboxShopDescription').errors &&
                      (shopForm.get('textboxShopDescription').dirty ||
                        shopForm.get('textboxShopDescription').touched)
                    "
                    class="form-errors-wrapper"
                  >
                    <div
                      *ngIf="
                        shopForm
                          .get('textboxShopDescription')
                          .hasError('required')
                      "
                    >
                      Shop Description field is required.
                    </div>
                    <span class="bar"></span>
                  </div>
                </div>
              </div>
              <div class="col-md-4">
                <div
                  class="form-group form-animate-text"
                  style="margin-top: 10px !important"
                >
                  <input
                    type="text"
                    class="form-text"
                    title="Please enter SAP Code"
                    maxlength="10"
                    required
                    formControlName="textboxSapCode"
                    [(ngModel)]="selectedSapCode"
                  />
                  <span class="bar"></span>
                  <label>SAP Code </label>
                  <!-- <div
                    *ngIf="
                      shopForm.get('textboxSapCode').errors &&
                      (shopForm.get('textboxSapCode').dirty ||
                        shopForm.get('textboxSapCode').touched)
                    "
                    class="form-errors-wrapper"
                  >
                    <div
                      *ngIf="
                        shopForm.get('textboxSapCode').hasError('required')
                      "
                    >
                      SAP Code field is required.
                    </div>

                    <span class="bar"></span>
                  </div> -->
                </div>
              </div>
            </div>
            <div class="row"></div>
          </div>
          <div class="col-md-2">
            <div class="q-btn-div">
              <button class="btn-forsave" type="submit">Save</button>
              <span class="btn-forsave bg-refresh" (click)="refresh()">
                <!-- <i class="fa fa-refresh"></i> -->
                Refresh
              </span>
              <span class="btn-forsave bg-exit" (click)="exit()">
                <!-- <i class="fa fa-times-circle-o"></i> -->
                Exit
              </span>
            </div>
          </div>
        </div>
      </div>
    </form>
  </div>
</div>

<div class="row">
  <div class="col-md-12">
    <div class="panel">
      <div class="panel-body defect-min-box">
        <table id="shopTable" class="display" width="100%"></table>
      </div>
    </div>
  </div>
  <div class="col-md-12">
    <div style="margin-top: 5px" *ngIf="loading">
      <ngx-skeleton-loader
        [theme]="{ height: '40px' }"
        loadingText="Loading Data"
        appearance="line"
        count="4"
        animation="pulse"
      >
      </ngx-skeleton-loader>
    </div>
  </div>
</div>
