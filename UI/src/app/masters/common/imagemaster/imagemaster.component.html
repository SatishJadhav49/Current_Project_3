<div class="row">
  <div class="master-headings q-strip" id="btn-add">Image Upload Master</div>
  <div *ngIf="canCreate" class="container" style="margin-top: 15px">
    <span class="selection-section">
      <div class="col-md-2 q-full-height shop">
        <h4 class="header-background">Shop</h4>
        <div
          class="flex"
          style="border-bottom: 1px dotted black; display: flex"
        >
          <input
            type="text"
            class="form-control search-input"
            autocomplete="off"
            id="myInput"
            placeholder=" Search Shop"
            [(ngModel)]="searchshopInput"
          />
        </div>
        <div
          class="q-card q-full-height q-scroll addpart dropdown-height"
          style="height: 257px"
        >
          <ul class="q-listbox" id="myUL">
            <li
              style="cursor: pointer; font-size: 12px"
              *ngFor="let shop of shoplist | search : searchshopInput"
              (click)="selectShop(shop)"
              [ngClass]="{ selected: isCurrentShop(shop) }"
            >
              <a style="color: black">{{ shop.Shop_Name }}</a>
            </li>
          </ul>
        </div>
      </div>
      <div class="col-md-2 q-full-height shop model">
        <h4 class="header-background">Model</h4>
        <div
          class="flex"
          style="border-bottom: 1px dotted black; display: flex"
        >
          <input
            type="text"
            class="form-control search-input"
            autocomplete="off"
            id="modelsearchinput"
            placeholder="Search Model"
            [(ngModel)]="searchModelInput"
          />
        </div>
        <div
          class="q-card q-full-height q-scroll addpart dropdown-height"
          style="height: 257px"
        >
          <ul class="q-listbox" id="modelUL">
            <li
              style="cursor: pointer; font-size: 12px"
              *ngFor="let model of modelList | search : searchModelInput"
              (click)="selectModel(model)"
              [ngClass]="{ selected: isCurrentModel(model) }"
            >
              <a style="color: black">{{ model.Model_Code }}</a>
            </li>
          </ul>
        </div>
      </div>
      <div class="col-md-2 q-full-height shop model">
        <h4 class="header-background">Area</h4>
        <div
          class="flex"
          style="border-bottom: 1px dotted black; display: flex"
        >
          <input
            type="text"
            class="form-control search-input"
            autocomplete="off"
            id="areasearchinput"
            placeholder="Search Area"
            [(ngModel)]="searchAreaInput"
          />
        </div>
        <div
          class="q-card q-full-height q-scroll addpart dropdown-height"
          style="height: 257px"
        >
          <ul class="q-listbox" id="areaUL">
            <li
              style="cursor: pointer; font-size: 12px"
              *ngFor="let check of AreaList | search : searchAreaInput"
              (click)="selectArea(check)"
              [ngClass]="{ selected: isCurrentArea(check) }"
            >
              <a style="color: black">{{ check.Area_Name }}</a>
            </li>
          </ul>
        </div>
      </div>
      <div class="col-md-2 q-full-height shop model">
        <h4 class="header-background">Part</h4>
        <div
          class="flex"
          style="border-bottom: 1px dotted black; display: flex"
        >
          <input
            type="text"
            class="form-control search-input"
            autocomplete="off"
            id="partsearchinput"
            placeholder="Search Part"
            [(ngModel)]="searchPartInput"
          />
        </div>
        <div
          class="q-card q-full-height q-scroll addpart dropdown-height"
          style="height: 257px"
        >
          <ul class="q-listbox" id="partUL">
            <li
              style="cursor: pointer; font-size: 12px"
              *ngFor="let part of partList | search : searchPartInput"
              (click)="selectPart(part)"
              [ngClass]="{ selected: isCurrentPart(part) }"
            >
              <a style="color: black">{{ part.Part_Name }}</a>
            </li>
          </ul>
        </div>
      </div>
    </span>
    <div class="col-md-4 q-full-height part">
      <div class="row" style="margin: 0px">
        <div class="col-md-12">
          <form class="example-form" #myForm="ngForm">
            <div class="row">
              <div class="col-md-6" style="padding: 0px 3px">
                <div
                  class="form-group form-animate-text"
                  style="margin-top: 10px !important"
                >
                  <input
                    type="text"
                    class="form-text"
                    title="Please enter Defect name"
                    required
                    [(ngModel)]="imagename"
                    [ngModelOptions]="{ standalone: true }"
                  />
                  <span class="bar"></span>
                  <label>Image Name</label>
                </div>
              </div>
              <div class="col-md-6">
                <div
                  class="form-group form-animate-text"
                  style="margin-top: 24px !important"
                >
                  <!-- (change)="compressFile()" -->
                  <!-- <input
                  type="file"
                  id="imgid"
                  
                  (change)="handleFileInput($event)"
                    #Image
                    accept="image/*"
                    placeholder="Upload file..."
                  /> -->
                  <button (click)="compressFile()">Chose image</button>
                  <span style="color: red">{{ errorMessage }}</span>
                </div>
              </div>
            </div>
          </form>
        </div>
      </div>
      <div class="row btn-row" *ngIf="ImageToUpload">
        <div class="col-md-4">
          <button class="btn-forsave" type="button" (click)="saveImage()">
            <span> Save </span>
          </button>
        </div>
        <div class="col-md-4">
          <a (click)="refresh()" class="btn-forsave bg-refresh" type="btn">
            <span> Refresh </span>
          </a>
        </div>
        <div class="col-md-4">
          <a (click)="exit()" class="btn-forsave bg-exit" type="btn">
            <span> Exit </span>
          </a>
        </div>
      </div>
      <div class="row" *ngIf="imageDataUrl && !uploadingImage">
        <div class="col-md-12">
          <img
            style="
              height: 100%;
              width: 100%;
              object-fit: contain;
              margin-top: 15px;
            "
            src="{{ imageDataUrl }}"
            alt=""
          />
        </div>
      </div>
      <div class="row" *ngIf="uploadingImage && !this.imageDataUrl">
        <div class="col-md-12">Uploading image</div>
      </div>
    </div>
  </div>
  <div class="row">
    <div class="col-md-12" style="margin-top: 10px">
      <div class="panel">
        <div class="panel-body defect-min-box">
          <table id="shopmodeltable" class="display" width="100%"></table>
        </div>
      </div>
    </div>
    <div class="col-md-12">
      <div style="margin-top: 5px" *ngIf="loading">
        <ngx-skeleton-loader
          [theme]="{ height: '40px' }"
          loadingText="Loading Data"
          appearance="line"
          count="4"
          animation="pulse"
        >
        </ngx-skeleton-loader>
      </div>
    </div>
  </div>
</div>
