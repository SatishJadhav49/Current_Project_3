<div class="row">
  <div class="master-headings q-strip" style="width: 100%; font-weight: 900; margin-top: 36px" id="btn-add">
    Plan Audit
  </div>
</div>

<div class="row" style="display: flex; flex-wrap: wrap" *ngIf="canCreate || modifyFlag">
  <!-- <div class="col-md-2 mt-15">
    <mat-form-field appearance="fill" style="width: 100%; height: 70px">
      <mat-label> Audit Type</mat-label>
      <mat-select [(ngModel)]="selectedAuditType">
        <mat-option
          *ngFor="let auditType of auditTypeList"
          [value]="auditType"
          >{{ auditType.Audit_Type }}</mat-option
        >
      </mat-select>
    </mat-form-field>
  </div> -->
  <div class="col-md-2 mt-15">
    <mat-form-field appearance="fill" style="width: 100%; height: 70px">
      <mat-label>From Date</mat-label>
      <input [min]="todayDate" #startdatepicker1 matInput [matDatepicker]="picker1"
        (dateChange)="onStartDateChange($event)" />
      <mat-datepicker-toggle matIconSuffix [for]="picker1"></mat-datepicker-toggle>
      <mat-datepicker #picker1></mat-datepicker>
    </mat-form-field>
  </div>
  <div class="col-md-2 mt-15">
    <mat-form-field appearance="fill" style="width: 100%; height: 70px">
      <mat-label>To Date</mat-label>
      <input #enddatepicker1 matInput [matDatepicker]="picker" (dateChange)="onEndDateChange($event)"
        [min]="realstartDate" />
      <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>
  </div>

  <div class="col-md-2 mt-15">
    <mat-form-field appearance="fill" style="width: 100%; height: 70px">
      <mat-label> Shop</mat-label>
      <mat-select [(ngModel)]="selectedShop" (selectionChange)="selectShop($event)">
        <mat-option *ngFor="let Shop of ShopList" [value]="Shop">{{
          Shop.Shop_Name
          }}</mat-option>
      </mat-select>
    </mat-form-field>
  </div>
  <div class="col-md-2 mt-15">
    <mat-form-field appearance="fill" style="width: 100%; height: 70px">
      <mat-label> Model</mat-label>
      <mat-select [(ngModel)]="selectedModel" (selectionChange)="selectModel($event)">
        <mat-option *ngFor="let model of modelList" [value]="model">{{
          model.Model_Code
          }}</mat-option>
      </mat-select>
    </mat-form-field>
  </div>
  <div class="col-md-2 mt-15">
    <mat-form-field appearance="fill" style="width: 100%; height: 70px">
      <mat-label> Schedule Type</mat-label>
      <mat-select [(ngModel)]="selectedSchedule">
        <mat-option *ngFor="let schedule of ScheduleList" [value]="schedule">{{
          schedule.Schedule_Type
          }}</mat-option>
      </mat-select>
    </mat-form-field>
  </div>
  <div class="col-md-2 mt-15">
    <div class="form-group form-animate-text" style="margin-top: 10px !important">
      <input style="text-align: center;" type="text" class="form-text" title="Please enter shop name" required
        [(ngModel)]="frequency" />
      <span class="bar"></span>
      <label>Frequency</label>
    </div>
  </div>
  <!-- <div class="col-md-2 mt-15">
    <mat-form-field appearance="fill" style="width: 100%; height: 70px">
      <mat-label> Assigned To</mat-label>
      <mat-select [(ngModel)]="selectedUser">
        <mat-option *ngFor="let user of UserList" [value]="user">{{
          user.Employee_Name
          }}</mat-option>
      </mat-select>
    </mat-form-field>
  </div> -->
  <div class="col-md-2 mt-15" style="
      align-items: center;
      justify-content: center;
      display: flex;
      margin-top: 0px !important;
    ">
    <mat-checkbox [(ngModel)]="isActive" class="example-margin">Active</mat-checkbox>
  </div>
  <div class="col-md-2 mt-15">
    <button class="btn-forsave" type="button" (click)="onSave()">
      {{ modifyFlag ? "Update" : "Save" }}
    </button>
  </div>
  <div class="col-md-2 mt-15" *ngIf="!modifyFlag">
    <span class="bg-refresh btn-forsave" (click)="refresh()"> Refresh </span>
  </div>
  <div class="col-md-2 mt-15" *ngIf="modifyFlag">
    <span class="bg-exit btn-forsave" (click)="refresh()"> Cancel </span>
  </div>
</div>

<div class="row">
  <div class="col-md-12" style="margin-top: 10px">
    <div class="panel">
      <div class="panel-body defect-min-box">
        <table id="shopmodeltable" class="display" width="100%"></table>
      </div>
    </div>
  </div>
  <div class="col-md-12">
    <div style="margin-top: 5px" *ngIf="loading">
      <ngx-skeleton-loader [theme]="{ height: '40px' }" loadingText="Loading Data" appearance="line" count="4"
        animation="pulse">
      </ngx-skeleton-loader>
    </div>
  </div>
</div>
