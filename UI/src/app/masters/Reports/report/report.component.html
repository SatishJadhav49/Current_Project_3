  <div class="col-md-2" style="margin-top: 15px">
    <mat-form-field appearance="fill" style="width: 100%; height: 70px">
      <mat-label> Model</mat-label>
      <mat-select
        [(ngModel)]="selectedModel"
        (selectionChange)="onSelectModel($event)"
      >
        <mat-option *ngFor="let model of modellist" [value]="model">{{
          model.Model_Code
        }}</mat-option>
      </mat-select>
    </mat-form-field>
  </div>
  <div class="col-md-2" style="margin-top: 15px">

    <mat-form-field appearance="fill" style="width: 100%; height: 70px">
      <mat-label>Start date</mat-label>
      <input
        matInput
        [matDatepicker]="picker"
        (dateChange)="onStartDateChange($event)"
      />
      <mat-datepicker-toggle
        matIconSuffix
        [for]="picker"
      ></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>
  </div>
  <div class="col-md-2" style="margin-top: 15px">
    <mat-form-field appearance="fill" style="width: 100%; height: 70px">
      <mat-label>End date</mat-label>
      <input
        matInput
        [matDatepicker]="picker2"
        (dateChange)="onEndDateChange($event)"
      />
      <mat-datepicker-toggle
        matIconSuffix
        [for]="picker2"
      ></mat-datepicker-toggle>
      <mat-datepicker #picker2></mat-datepicker>
    </mat-form-field>
  </div>
  <div class="col-md-4" style="margin-top: 15px">
    <mat-form-field
      appearance="fill"
      style="width: 100%; height: 70px"
      *ngIf="this.audittypeid == 1"
    >
      <mat-label>Select VIN No</mat-label>
      <mat-select #select>
        <!-- <div class="select-all">
          <mat-checkbox
            [(ngModel)]="allSelected"
            [ngModelOptions]="{ standalone: true }"
            (change)="toggleAllSelection()"
            color="primary"
            >Select All</mat-checkbox
          >
        </div> -->
        <mat-option
          (click)="optionClick(biw.VIN_No)"
          *ngFor="let biw of biwlist"
          [value]="biw.VIN_No"
        >
          {{ biw.VIN_No }} - {{ biw.Audit_Date | date : "dd/MM/yyyy" }}
        </mat-option>
      </mat-select>
    </mat-form-field>
    <mat-form-field
      appearance="fill"
      style="width: 100%; height: 70px"
      *ngIf="this.audittypeid != 1"
    >
      <mat-label>Select {{ audit }} No</mat-label>
      <mat-select #select >
        <!-- <div class="select-all">
          <mat-checkbox
            [(ngModel)]="allSelected"
            [ngModelOptions]="{ standalone: true }"
            (change)="toggleAllSelection()"
            color="primary"
            >Select All</mat-checkbox
          >
        </div> -->
        <mat-option
          (click)="optionClick(biw.Body_No)"
          *ngFor="let biw of biwlist"
          [value]="biw.Body_No"
        >
          {{ biw.Body_No }} - {{ biw.Audit_Date | date : "dd/MM/yyyy" }}
        </mat-option>
      </mat-select>
    </mat-form-field>
  </div>
  <div class="col-md-2" style="margin-top: 20px">
    <button class="btn-forsave" type="button" (click)="viewReport()">
      Get Report
    </button>
  </div>
</div>

<div class="row">
  <div class="col-md-12" *ngIf="Show_Report">
    <iframe
      style="width: 100%; height: 59em"
      [src]="reportUrl"
      class="report-frame"
      id="pdfDocument"
    ></iframe>
  </div>
</div>
