<div class="row" style="margin: 0 5px;" *ngIf="Show_Report">
  <!-- TCF Chart -->
  <div id="chart" *ngIf="chartOptionsTCF">
    <apx-chart
      [series]="chartOptionsTCF.series"
      [chart]="chartOptionsTCF.chart"
      [xaxis]="chartOptionsTCF.xaxis"
      [yaxis]="chartOptionsTCF.yaxis"
      [dataLabels]="chartOptionsTCF.dataLabels"
      [grid]="chartOptionsTCF.grid"
      [stroke]="chartOptionsTCF.stroke"
      [title]="chartOptionsTCF.title"
      [markers]="chartOptionsTCF.markers"
      [colors]="chartOptionsTCF.colors"
    ></apx-chart>
  </div>
  </div>
<div class="row" style="margin: 0 5px;" *ngIf="Show_Report">

      [dataLabels]="chartOptionsBIW.dataLabels"
      [grid]="chartOptionsBIW.grid"
      [stroke]="chartOptionsBIW.stroke"
      [title]="chartOptionsBIW.title"
      [markers]="chartOptionsBIW.markers"
      [colors]="chartOptionsBIW.colors"
    ></apx-chart>
  </div>
  </div>
