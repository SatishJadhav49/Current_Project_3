<div class="row">
  <div class="col-md-12" *ngIf="Show_Report">
    <iframe
      style="width: 100%; height: 59em"
      [src]="reportUrl"
      class="report-frame"
      id="pdfDocument"
    ></iframe>
  </div>
</div>
