<div class="row">
  <div
    class="master-headings q-strip"
    style="width: 100%; font-weight: 900; margin-top: 36px"
    id="btn-add"
  >
    {{ AuditName | uppercase }} - Monthly Reports
  </div>
</div>
<div class="row" style="font-size: 12px">
  <div class="col-md-3" style="margin-top: 15px">
    <mat-form-field appearance="fill" style="width: 100%; height: 70px">
      <mat-label> Model</mat-label>
      <mat-select
        [(ngModel)]="selectedModel"
        (selectionChange)="onSelectModel($event)"
      >
        <mat-option *ngFor="let model of modellist" [value]="model">{{
          model.Model_Code
        }}</mat-option>
      </mat-select>
    </mat-form-field>
  </div>
  <div class="col-md-3" style="margin-top: 15px">
    <mat-form-field appearance="fill" style="width: 100%; height: 70px">
      <mat-label>From Date</mat-label>
      <input
        #startdatepicker1
        matInput
        [matDatepicker]="picker1"
        (dateChange)="onStartDateChange($event)"
      />
      <mat-datepicker-toggle
        matIconSuffix
        [for]="picker1"
      ></mat-datepicker-toggle>
      <mat-datepicker #picker1></mat-datepicker>
    </mat-form-field>
  </div>
  <div class="col-md-3" style="margin-top: 15px">
    <mat-form-field appearance="fill" style="width: 100%; height: 70px">
      <mat-label>To Date</mat-label>
      <input
        [min]="actualStartDate"
        #enddatepicker1
        matInput
        [matDatepicker]="picker"
        (dateChange)="onEndDateChange($event)"
      />
      <mat-datepicker-toggle
        matIconSuffix
        [for]="picker"
      ></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>
  </div>
  <div class="col-md-3" style="margin-top: 15px">
    <button class="btn-forsave" type="submit" (click)="getReport()">
      Get Report
    </button>
  </div>
</div>
<div class="row">
  <div class="col-md-12" *ngIf="Show_Report">
    <iframe
      style="width: 100%; height: 59em"
      [src]="reportUrl"
      class="report-frame"
      id="pdfDocument"
    ></iframe>
  </div>
</div>
