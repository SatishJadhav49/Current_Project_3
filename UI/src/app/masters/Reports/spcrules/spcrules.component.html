<div class="row" *ngIf="showSPCRules">
  <div class="col-md-12" style="padding: 0">
    <div class="table-container" style="overflow-x: auto; width: 100%">
      <table style="margin-top: 10px" class="table table-bordered">
        <thead class="sticky-header">
          <tr>
            <th class="header-background">Rule No</th>
            <th class="header-background">Rule Name</th>
            <th class="header-background">Pattern</th>
            <th class="header-background">Result</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of RulesList">
            <td>{{ item.Rule }}</td>
            <td>{{ item.Rule_Name }}</td>
            <td>{{ item.Description }}</td>
            <ng-container [ngSwitch]="item.Result">
              <td *ngSwitchCase="1" style="background: red; color: white">
                Fail
              </td>
              <td *ngSwitchCase="2" style="background: green; color: white">
                Pass
              </td>
              <td *ngSwitchCase="3">NA</td>
            </ng-container>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div class="row" *ngIf="Show_Report">
  <div id="chart">
    <apx-chart
      [series]="chartOptions.series"
      [chart]="chartOptions.chart"
      [xaxis]="chartOptions.xaxis"
      [yaxis]="chartOptions.yaxis"
      [dataLabels]="chartOptions.dataLabels"
      [grid]="chartOptions.grid"
      [stroke]="chartOptions.stroke"
      [title]="chartOptions.title"
      [markers]="chartOptions.markers"
      [colors]="chartOptions.colors"
    ></apx-chart>
  </div>
</div>
