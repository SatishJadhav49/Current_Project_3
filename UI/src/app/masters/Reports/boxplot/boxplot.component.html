<!-- box plot -->

<div id="box" *ngIf="showBoxPlot">
    <apx-chart [series]="boxOptions.series" [chart]="boxOptions.chart" [xaxis]="boxOptions.xaxis"
        [title]="boxOptions.title" [colors]="boxOptions.colors" [dataLabels]="boxOptions.dataLabels"
        [annotations]="boxOptions.annotations"></apx-chart>
</div>
