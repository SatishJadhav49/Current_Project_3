<div class="row">
  <div
    class="master-headings q-strip"
    style="width: 100%; font-weight: 900; margin-top: 36px"
    id="btn-add"
  >
    {{ AuditName | uppercase }} - Gigital Gapgun Reports
  </div>
</div>
<div class="row" style="font-size: 12px">
  <div class="col-md-2" style="margin-top: 15px">
    <mat-form-field appearance="fill" style="width: 100%; height: 70px">
      <mat-label> Model</mat-label>
      <mat-select
        [(ngModel)]="selectedModel"
        (selectionChange)="onSelectModel($event)"
      >
        <mat-option *ngFor="let model of modellist" [value]="model">{{
          model.Model_Code
        }}</mat-option>
      </mat-select>
    </mat-form-field>
  </div>
  <div class="col-md-2" style="margin-top: 15px">
    <mat-form-field appearance="fill" style="width: 100%; height: 70px">
      <mat-label>Select Audit date</mat-label>
      <input
        matInput
        [matDatepicker]="picker"
        (dateChange)="onStartDateChange($event)"
      />
      <mat-datepicker-toggle
        matIconSuffix
        [for]="picker"
      ></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>
  </div>

  <div class="col-md-2" style="margin-top: 20px">
    <button class="btn-forsave" type="button" [disabled]="loading" (click)="viewReport()">
     {{ loading ? 'Generating...' : 'Get Report' }}
    </button>
  </div>

  <div class="col-md-2" style="margin-top: 20px">
    <button class="btn-sendmail" *ngIf="auditId" (click)="sendAutoMail()">
      Send Mail
    </button>
  </div>
</div>

<div class="row">
  <div class="col-md-12" *ngIf="Show_Report">
    <div class="card">
      <div class="card-header" style="font-weight: 600">
        Digital Gapgun Mail Preview
      </div>

      <div class="card-body">
        <div [innerHTML]="mailPreview"></div>
      </div>
    </div>
  </div>
</div>

<div class="loader-overlay" *ngIf="loading">
  <div class="loader-content">
    <div class="custom-spinner"></div>
    <div class="loader-text">
      Generating Report...
    </div>
  </div>
</div>
