<!-- Loader overlays -->
<div *ngIf="isLoading" class="loader-overlay">
  <div class="loader-container">
    <div class="loader"></div>
    <p class="loader-text">Uploading file, please wait...</p>
  </div>
</div>
<div *ngIf="vinLoading" class="loader-overlay">
  <div class="loader-container">
    <div class="loader"></div>
    <p class="loader-text">Fetching VIN data, please wait...</p>
  </div>
</div>

<!-- Heading -->
<div class="row">
  <div class="master-headings q-strip" id="btn-add">Digital Gapgun</div>
</div>

<!-- Model + File Upload + Upload Button -->
<div class="row" style="font-size: 12px; margin-top: 15px">
  <div class="col-md-2">
    <mat-form-field appearance="outline" style="width: 100%; height: 45px">
      <mat-label>Model</mat-label>
      <mat-select
        [(ngModel)]="selectedModel"
        (selectionChange)="onSelectModel($event)"
      >
        <mat-option *ngFor="let model of modellist" [value]="model">
          {{ model.Model_Code }}
        </mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <div class="col-md-3">
    <input
      id="fileInput"
      multiple
      (change)="onFileChange($event)"
      class="form-control"
      type="file"
      accept=".xlsx, .csv"
    />
  </div>

  <div class="col-md-2">
    <button class="btn-forsave" (click)="uploadExcel()">Upload</button>
  </div>
</div>

<!-- Separator -->
<div class="col-md-12 line-separator"></div>

<!-- VIN Input + Get Data Button -->
<div class="row" style="margin-top: 20px">
  <div class="col-md-2">
    <input
      type="text"
      [(ngModel)]="vinInput"
      class="form-control same-style"
      placeholder="Enter VIN No"
    />
  </div>

  <div class="col-md-2">
    <button class="btn-forsave" (click)="searchVin()" [disabled]="vinLoading">
      Get Data
    </button>
  </div>

  <div class="col-md-6"></div>

  <!-- <div class="col-md-2 text-right">
    <button class="btn btn-success" *ngIf="auditId" (click)="sendAutoMail()">
      Send Mail
    </button>
  </div> -->
</div>

<!-- Table section -->
<div class="row" style="margin-top: 20px">
  <div class="col-md-12">
    <div class="panel">
      <div class="panel-body defect-min-box">
        <table id="shopmodeltable" class="display" width="100%"></table>
      </div>
    </div>
  </div>

  <div class="col-md-12">
    <div style="margin-top: 5px" *ngIf="loading">
      <ngx-skeleton-loader
        [theme]="{ height: '40px' }"
        loadingText="Loading Data"
        appearance="line"
        count="4"
        animation="pulse"
      >
      </ngx-skeleton-loader>
    </div>
  </div>
</div>
