<!-- Mid section row START -->
<div class="row">
  <div
    class="master-headings q-strip"
    style="width: 100%; font-weight: 900; margin-top: 36px"
    id="btn-add"
  >
    User Roles
    <!-- <span class="btn btn-primary" style="float:right;" (click)="back()">Back</span> -->
  </div>
  <div
    class="col-md-12 defect-min-box mainbox-body"
    *ngIf="canCreate || modify"
  >
    <div class="panel q-sm-btm-margin">
      <div class="panel-body q-panel-body">
        <div class="col-md-10 defect-min-box">
          <div class="col-md-4">
            <mat-form-field appearance="fill" style="width: 100%; height: 70px">
              <mat-label>Employee Name</mat-label>
              <mat-select [(ngModel)]="selectedEmpID">
                <mat-option
                  *ngFor="let item of empList"
                  [value]="item.Employee_ID"
                >
                  {{ item.Employee_Name }}</mat-option
                >
              </mat-select>
            </mat-form-field>
          </div>
          <div class="col-md-4">
            <mat-form-field appearance="fill" style="width: 100%; height: 70px">
              <mat-label>Employee Role</mat-label>
              <mat-select
                multiple
                [(ngModel)]="selectedRoleID"
                (selectionChange)="onRoleChange($event)"
              >
                <mat-option
                  *ngFor="let item of roleList"
                  [value]="item.Role_ID"
                >
                  {{ item.Role_Name }}</mat-option
                >
              </mat-select>
            </mat-form-field>
          </div>
          <div class="col-md-4">
            <mat-form-field appearance="fill" style="width: 100%; height: 70px">
              <mat-label>Employee Rights</mat-label>
              <mat-select
                multiple
                [(ngModel)]="selectedRight"
                (selectionChange)="onRightChange($event)"
              >
                <mat-option
                  *ngFor="let item of rightsList"
                  [value]="item.Right_Name"
                >
                  {{ item.Right_Name }}</mat-option
                >
              </mat-select>
            </mat-form-field>
          </div>
        </div>
        <div class="col-md-2">
          <div class="q-btn-div">
            <a class="btn-forsave" (click)="onSave()">
              <!-- <i class="fa fa-save" style="padding-right: 15px"></i> -->
              <span> {{ modify ? "Update" : "Save" }} </span>
            </a>
            <a (click)="refresh()" class="bg-refresh btn-forsave" type="btn">
              <!-- <i class="fa fa-refresh" style="padding-right: 15px"></i> -->
              <span> Refresh </span>
            </a>
            <a (click)="exit()" class="bg-exit btn-forsave" type="btn">
              <!-- <i class="fa fa-times-circle-o" style="padding-right: 15px"></i> -->
              <span> Exit </span>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="row">
  <div class="col-md-12">
    <div class="panel">
      <div class="panel-body defect-min-box">
        <table id="createRoleTable" class="display" width="100%"></table>
      </div>
    </div>
  </div>
  <div class="col-md-12">
    <div style="margin-top: 5px" *ngIf="loading">
      <ngx-skeleton-loader
        [theme]="{ height: '40px' }"
        loadingText="Loading Data"
        appearance="line"
        count="4"
        animation="pulse"
      >
      </ngx-skeleton-loader>
    </div>
  </div>
</div>

<!-- data table code ends here -->
